<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90">
  <defs>
    <!-- Metallic gold gradient for crown -->
    <linearGradient id="crownGradH" x1="50" y1="20" x2="50" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F0D678"/>
      <stop offset="45%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8A6820"/>
    </linearGradient>
    <linearGradient id="bandGradH" x1="50" y1="71" x2="50" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#9A7830"/>
    </linearGradient>
  </defs>

  <!-- Background: transparent (no rect) -->

  <!-- ─── Crown icon — 3 peaks, centered at x=50 y=45 ─── -->
  <!--
    Center peak: y=20  (tallest)
    Side peaks:  y=40
    Valleys:     y=54
    Base:        y=71, band to y=80
  -->
  <path d="
    M 16,71
    L 16,59
    L 30,40
    L 40,54
    L 50,20
    L 60,54
    L 70,40
    L 84,59
    L 84,71
    Z
  " fill="url(#crownGradH)"/>

  <!-- Base band -->
  <rect x="10" y="71" width="80" height="9" rx="2" fill="url(#bandGradH)"/>

  <!-- ─── Gem ornaments ─── -->
  <!-- Left peak (30, 40) -->
  <circle cx="30" cy="40" r="4.5" fill="#D4AE52"/>
  <circle cx="30" cy="40" r="2.5" fill="#111111"/>

  <!-- Center peak (50, 20) -->
  <circle cx="50" cy="20" r="6"   fill="#F0D678"/>
  <circle cx="50" cy="20" r="3.5" fill="#111111"/>

  <!-- Right peak (70, 40) -->
  <circle cx="70" cy="40" r="4.5" fill="#D4AE52"/>
  <circle cx="70" cy="40" r="2.5" fill="#111111"/>

  <!-- ─── Vertical separator ─── -->
  <line x1="105" y1="12" x2="105" y2="78" stroke="#C9A84C" stroke-width="0.8" opacity="0.35"/>

  <!-- ─── Wordmark ─── -->
  <!-- "GROWN UP" — gold, smaller, qualifier line -->
  <text
    x="118" y="40"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="15"
    font-weight="bold"
    fill="#C9A84C"
    letter-spacing="4.5">GROWN UP</text>

  <!-- "CREATORS" — white, larger, dominant brand word -->
  <text
    x="118" y="68"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="25"
    font-weight="bold"
    fill="#ffffff"
    letter-spacing="4">CREATORS</text>

</svg>
