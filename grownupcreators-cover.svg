<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1084 576" width="1084" height="576">
  <defs>

    <!-- Crown gradient: peak (280,170) → base band bottom (280,300) -->
    <linearGradient id="cg" x1="280" y1="170" x2="280" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F0D678"/>
      <stop offset="40%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8A6820"/>
    </linearGradient>
    <linearGradient id="bnd" x1="280" y1="283" x2="280" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#9A7830"/>
    </linearGradient>

    <!-- Gold radial glow behind crown -->
    <radialGradient id="gl" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#C9A84C" stop-opacity="0.28"/>
      <stop offset="50%"  stop-color="#C9A84C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>

    <!-- Hex tile pattern -->
    <pattern id="hp" x="0" y="0" width="56" height="100" patternUnits="userSpaceOnUse">
      <path d="M28 66L0 50V18L28 2l28 16v32L28 66zM28 100L0 84V68l28 16 28-16v16L28 100z"
            fill="none" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.09"/>
    </pattern>

    <!-- Photo left-edge fade mask: transparent at x=570, fully opaque at x=790 -->
    <linearGradient id="pf" x1="570" y1="0" x2="790" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="1"/>
    </linearGradient>
    <mask id="pm">
      <rect x="570" y="0" width="514" height="576" fill="url(#pf)"/>
    </mask>

  </defs>

  <!-- ─── Background ─── -->
  <rect width="1084" height="576" fill="#1a1a1a"/>

  <!-- Hex texture — full canvas -->
  <rect width="1084" height="576" fill="url(#hp)"/>

  <!-- ─── Photo — right side, chest-up, fades into dark bg on left ─── -->
  <image
    href="colin-capitol.JPEG"
    x="570" y="0" width="514" height="576"
    preserveAspectRatio="xMidYMin slice"
    mask="url(#pm)"/>

  <!-- Dark overlay along the far right edge — keeps frame clean -->
  <rect x="980" y="0" width="104" height="576"
        fill="url(#rightEdge)" opacity="0.0"/>

  <!-- ─── Gold glow behind crown ─── -->
  <ellipse cx="280" cy="233" rx="255" ry="195" fill="url(#gl)"/>

  <!-- ─── Large hex ornaments — left zone only ─── -->
  <!-- Inner ring, pointy-top, r=130, center (280,233) -->
  <polygon points="280,103 393,168 393,298 280,363 167,298 167,168"
           fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.08"/>
  <!-- Outer ring, r=210, center (280,245) -->
  <polygon points="280,35 462,140 462,350 280,455 98,350 98,140"
           fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.04"/>

  <!-- ─── Inset border frame — full banner ─── -->
  <rect x="18" y="18" width="1048" height="540"
        fill="none" stroke="#C9A84C" stroke-width="0.8" opacity="0.22"/>

  <!-- Top accent line — left zone -->
  <line x1="36" y1="36" x2="530" y2="36" stroke="#C9A84C" stroke-width="0.7" opacity="0.3"/>
  <!-- Bottom accent line — left zone -->
  <line x1="36" y1="548" x2="530" y2="548" stroke="#C9A84C" stroke-width="0.7" opacity="0.3"/>

  <!-- ─── Crown — 3 peaks, centered at x=280 ─── -->
  <!--
    Center peak:  (280, 170)
    Side peaks:   (212, 228)  (348, 228)
    Valleys:      (245, 248)  (315, 248)
    Wall corners: (175, 268)  (385, 268)
    Base y=283, band to y=300
  -->
  <path d="
    M 175,283
    L 175,268
    L 212,228
    L 245,248
    L 280,170
    L 315,248
    L 348,228
    L 385,268
    L 385,283
    Z
  " fill="url(#cg)"/>

  <!-- Crown base band -->
  <rect x="162" y="283" width="236" height="17" rx="5" fill="url(#bnd)"/>

  <!-- Gem ornaments -->
  <!-- Left peak -->
  <circle cx="212" cy="228" r="18"   fill="#D4AE52"/>
  <circle cx="212" cy="228" r="10"   fill="#1a1a1a"/>
  <!-- Center peak -->
  <circle cx="280" cy="170" r="22"   fill="#F0D678"/>
  <circle cx="280" cy="170" r="13"   fill="#1a1a1a"/>
  <!-- Right peak -->
  <circle cx="348" cy="228" r="18"   fill="#D4AE52"/>
  <circle cx="348" cy="228" r="10"   fill="#1a1a1a"/>

  <!-- ─── Wordmark ─── -->

  <!-- "GROWN UP" — gold qualifier label -->
  <text
    x="280" y="334"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="22"
    font-weight="bold"
    fill="#C9A84C"
    text-anchor="middle"
    letter-spacing="11">GROWN UP</text>

  <!-- "CREATORS" — dominant white headline -->
  <text
    x="280" y="414"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="78"
    font-weight="bold"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="4">CREATORS</text>

</svg>
